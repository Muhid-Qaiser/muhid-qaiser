name: BREACH Agent-01

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: profile-writes
  cancel-in-progress: false

jobs:
  simulate:
    if: github.event.issue.title == '[BREACH] PROMPT_INJECTION' || github.event.issue.title == '[BREACH] TOOL_HIJACK' || github.event.issue.title == '[BREACH] ARTIFACT_POISONING'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Resolve simulation
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTOR: ${{ github.actor }}
        run: python scripts/process_breach.py

      - name: Commit scoreboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/breach.json assets/breach.svg
          git diff --cached --quiet || git commit -m "game: resolve breach #${{ github.event.issue.number }}"
          git push

      - name: Reply with result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file breach-result.md

      - name: Close simulation issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER"
