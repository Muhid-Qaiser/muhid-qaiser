name: Redraw the map

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write

concurrency:
  group: profile-redraw
  cancel-in-progress: false

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: Muhid-Qaiser
        run: python scripts/fetch_stats.py

      - name: Redraw the data-driven figures
        run: |
          python scripts/build_map.py
          python scripts/build_ledger.py

      - name: Commit whatever changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/map.svg assets/ledger.svg data/stats.json
          git diff --cached --quiet || git commit -m "Redraw the map and the ledger"
          git push
