<svg xmlns="http://www.w3.org/2000/svg" width="600" height="148"
     viewBox="0 0 600 148" role="img">
<defs>
  <filter id="ink" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3"
                  seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="inkSoft" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2"
                  seed="19" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/>
             <feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowMed" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="glowWide" x="-140%" y="-140%" width="380%" height="380%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <radialGradient id="lantern" cx="50%" cy="46%" r="62%">
    <stop offset="0%" stop-color="#16203A" stop-opacity=".95"/>
    <stop offset="58%" stop-color="#0B1120" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="78%">
    <stop offset="55%" stop-color="#080B12" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".72"/>
  </radialGradient>

</defs>
<style>
  text { font-family: 'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','Times New Roman',serif; }
  .mote { animation: drift 11s ease-in-out infinite; transform-box: fill-box;
           transform-origin: center; }
  @keyframes drift {
    0%   { transform: translate(0,6px);      opacity: 0; }
    18%  { opacity: .85; }
    72%  { opacity: .5; }
    100% { transform: translate(5px,-30px); opacity: 0; }
  }
  .breathe { animation: breathe 6.5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .48 } 50% { opacity: .95 } }
  @media (prefers-reduced-motion: reduce) {
    .mote, .breathe { animation: none; opacity: .6; }
  }
</style>
<rect width="600" height="148" fill="#080B12"/>
<rect x="3" y="3" width="594" height="142" rx="5" fill="#111725" fill-opacity=".55" stroke="#E9E6DC" stroke-width="1.3" stroke-opacity=".26" filter="url(#ink)"/>
<circle cx="66" cy="74" r="34" fill="#151D30"/><circle cx="66" cy="74" r="34" fill="none" stroke="#E9E6DC" stroke-width="1.2" opacity=".38" filter="url(#ink)"/><path d="M 63 90 C 46 76, 52 58, 72 57 C 82 75, 74 88, 63 90 Z" fill="none" stroke="#B4BDCE" stroke-width="2" stroke-linecap="round" opacity="0.8"/><path d="M 63 90 L 69 61" fill="none" stroke="#B4BDCE" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/><circle cx="67" cy="73" r="4" fill="#A9E8F0" filter="url(#glowMed)"/>
<text x="122" y="56" font-size="16" fill="#E9E6DC" letter-spacing="3.6" font-weight="normal" text-anchor="start" opacity="1">AGROVQ-HYBRIDNET</text>
<text x="122" y="78" font-size="10" fill="#A9E8F0" letter-spacing="2.6" font-weight="normal" text-anchor="start" opacity="1">VISION · LANGUAGE</text>
<text x="122" y="102" font-size="13.5" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">Visual question answering over crop imagery — a model that</text>
<text x="122" y="122" font-size="13.5" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">has to look at a field and answer a question about it.</text>
<circle class="mote" cx="228.0" cy="73.2" r="1.34" fill="#A9E8F0" opacity="0" style="animation-delay:-5.0s;animation-duration:12.1s"/><circle class="mote" cx="382.0" cy="53.3" r="1.63" fill="#A9E8F0" opacity="0" style="animation-delay:-2.7s;animation-duration:9.1s"/><circle class="mote" cx="214.2" cy="42.8" r="1.77" fill="#A9E8F0" opacity="0" style="animation-delay:-8.8s;animation-duration:11.2s"/><circle class="mote" cx="537.2" cy="52.8" r="1.96" fill="#A9E8F0" opacity="0" style="animation-delay:-9.8s;animation-duration:14.7s"/><circle class="mote" cx="54.2" cy="71.1" r="1.61" fill="#A9E8F0" opacity="0" style="animation-delay:-2.5s;animation-duration:11.1s"/><circle class="mote" cx="201.1" cy="53.2" r="1.82" fill="#A9E8F0" opacity="0" style="animation-delay:-4.8s;animation-duration:11.4s"/>
</svg>