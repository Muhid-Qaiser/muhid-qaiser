    <ellipse cx="80" cy="143" rx="16" ry="28" fill="#080B12" transform="rotate(-9 80 143)"/>
    <ellipse cx="140" cy="143" rx="16" ry="28" fill="#080B12" transform="rotate(9 140 143)"/>
    <path d="M 46 104 C 38 118, 36 136, 39 156 C 42 190, 58 214, 82 224 C 57 202, 47 168, 48 134 Z" fill="#39404E" opacity=".3"/>
  </g>
  <path d="M 111 90 L 106 116 L 114 142 L 107 170 L 115 196 L 110 218" fill="none" stroke="#2A3040" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 108 104 L 122 99" fill="none" stroke="#2A3040" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 107 170 L 92 182" fill="none" stroke="#2A3040" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <g style="mix-blend-mode:screen">
    <path d="M 111 90 L 106 116 L 114 142 L 107 170 L 115 196 L 110 218" fill="none" stroke="#A9E8F0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" filter="url(#glowWide)"/>
    <path d="M 108 104 L 122 99" fill="none" stroke="#A9E8F0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" filter="url(#glowWide)"/>
    <path d="M 107 170 L 92 182" fill="none" stroke="#A9E8F0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" filter="url(#glowWide)"/>
    <path d="M 111 90 L 106 116 L 114 142 L 107 170 L 115 196 L 110 218" fill="none" stroke="#A9E8F0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" filter="url(#glowMed)"/>
    <path d="M 108 104 L 122 99" fill="none" stroke="#A9E8F0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" filter="url(#glowMed)"/>
    <path d="M 107 170 L 92 182" fill="none" stroke="#A9E8F0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" filter="url(#glowMed)"/>
  </g>
  <path d="M 111 90 L 106 116 L 114 142 L 107 170 L 115 196 L 110 218" fill="none" stroke="#DEFBFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="breathe"/>
  <path d="M 108 104 L 122 99" fill="none" stroke="#DEFBFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="breathe"/>
  <path d="M 107 170 L 92 182" fill="none" stroke="#DEFBFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="breathe"/>
</g>
