<text x="72" y="221" font-size="17.5" fill="#E9E6DC" text-anchor="start" opacity="1">AI Security Engineer. I red-team large language models and the agents built on them.</text>
<text x="72" y="253" font-size="15" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">Before this, computer vision — where adversarial examples were first found.</text>
<text x="72" y="279" font-size="15" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">The method did not change when the input became language.</text>
