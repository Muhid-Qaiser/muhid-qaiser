<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#13202b" stroke-width="1" opacity=".5"/>
  </pattern>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0%" stop-color="#67e8f9"/>
    <stop offset="52%" stop-color="#f1d6b8"/>
    <stop offset="100%" stop-color="#ff5a67"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="typingClip">
    <rect x="78" y="354" width="0" height="26">
      <animate attributeName="width" values="0;540;540;0" keyTimes="0;0.66;0.84;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
</defs>

<rect x="1" y="1" width="1198" height="418" rx="18" fill="#070b10" stroke="#26313d" stroke-width="2"/>
<rect x="1" y="1" width="1198" height="418" rx="18" fill="url(#grid)" opacity=".72"/>

<!-- top bar -->
<circle cx="28" cy="27" r="5" fill="#ff5a67"/>
<circle cx="46" cy="27" r="5" fill="#f7c873"/>
<circle cx="64" cy="27" r="5" fill="#63e6be"/>
<text x="88" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8896a5">MQ://PROFILE_NODE</text>
<circle cx="1067" cy="27" r="5" fill="#63e6be">
  <animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/>
</circle>
<text x="1080" y="32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#63e6be">ONLINE</text>

<!-- title -->
<text x="62" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="2" fill="#67e8f9">COMPUTER VISION × AGENTIC SECURITY</text>
<text x="58" y="151" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="800" fill="#e8edf2">MUHID QAISER</text>
<text x="62" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8896a5">AI Security Engineer  /  perception -> intelligence -> autonomy -> defense</text>

<!-- visual bridge -->
<line x1="74" y1="251" x2="765" y2="251" stroke="url(#line)" stroke-width="3"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <circle cx="94" cy="251" r="10" fill="#070b10" stroke="#67e8f9" stroke-width="3"/>
  <circle cx="316" cy="251" r="10" fill="#070b10" stroke="#f1d6b8" stroke-width="3"/>
  <circle cx="540" cy="251" r="10" fill="#070b10" stroke="#f7c873" stroke-width="3"/>
  <circle cx="745" cy="251" r="11" fill="#070b10" stroke="#ff5a67" stroke-width="3" filter="url(#glow)">
    <animate attributeName="r" values="9;12;9" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="69" y="284" font-size="12" fill="#67e8f9">01 // SEE</text>
  <text x="267" y="284" font-size="12" fill="#f1d6b8">02 // REASON</text>
  <text x="499" y="284" font-size="12" fill="#f7c873">03 // ACT</text>
  <text x="699" y="284" font-size="12" fill="#ff5a67">04 // DEFEND</text>
</g>

<!-- right visual: perception -> agent -->
<rect x="840" y="74" width="292" height="228" rx="14" fill="#0d131a" stroke="#26313d"/>
<text x="862" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8896a5">LIVE // SYSTEM MODEL</text>

<!-- camera frame -->
<rect x="862" y="121" width="116" height="104" rx="7" fill="#091018" stroke="#67e8f9" stroke-opacity=".55"/>
<path d="M874 136h18 M874 136v18 M966 136h-18 M966 136v18 M874 210h18 M874 210v-18 M966 210h-18 M966 210v-18" stroke="#67e8f9" stroke-width="2"/>
<rect x="896" y="147" width="39" height="50" fill="none" stroke="#67e8f9" stroke-width="2">
  <animate attributeName="x" values="892;902;892" dur="4s" repeatCount="indefinite"/>
</rect>
<line x1="864" y1="140" x2="976" y2="140" stroke="#67e8f9" opacity=".65">
  <animate attributeName="y1" values="130;216;130" dur="3.2s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="130;216;130" dur="3.2s" repeatCount="indefinite"/>
</line>
<text x="870" y="245" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#67e8f9">VISION // 0.98</text>

<!-- agent core -->
<line x1="980" y1="173" x2="1023" y2="173" stroke="#f1d6b8" stroke-width="2" stroke-dasharray="5 5"/>
<circle cx="1057" cy="173" r="31" fill="#070b10" stroke="#f1d6b8" stroke-width="2"/>
<circle cx="1057" cy="173" r="8" fill="#f1d6b8">
  <animate attributeName="opacity" values=".4;1;.4" dur="1.6s" repeatCount="indefinite"/>
</circle>
<text x="1033" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#f1d6b8">AGENT CORE</text>
<path d="M1057 140 C1090 128 1115 140 1120 163 C1125 189 1108 206 1087 211" fill="none" stroke="#ff5a67" stroke-width="2" stroke-dasharray="4 6">
  <animate attributeName="stroke-dashoffset" values="0;-40" dur="2.2s" repeatCount="indefinite"/>
</path>
<text x="1020" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#ff5a67">SECURITY // ACTIVE</text>

<!-- quote -->
<text x="62" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#8896a5">&gt;</text>
<g clip-path="url(#typingClip)">
  <text x="78" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#e8edf2">the safest agent is the one you tried hardest to break.</text>
</g>
<rect x="78" y="354" width="8" height="20" fill="#ff5a67">
  <animate attributeName="x" values="78;618;618;78" keyTimes="0;0.66;0.84;1" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;0;1" dur=".85s" repeatCount="indefinite"/>
</rect>
</svg>