<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="122"
     viewBox="0 0 1200 122" role="img">
<defs>
  <filter id="ink" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3"
                  seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="inkSoft" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2"
                  seed="19" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- The game's bloom pass: pale things bleed light into the dark. -->
  <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/>
             <feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bloomSoft" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur stdDeviation="1.7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/>
             <feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowMed" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="glowWide" x="-140%" y="-140%" width="380%" height="380%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <radialGradient id="lantern" cx="50%" cy="46%" r="62%">
    <stop offset="0%" stop-color="#16203A" stop-opacity=".9"/>
    <stop offset="58%" stop-color="#0B1120" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="78%">
    <stop offset="52%" stop-color="#080B12" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".74"/>
  </radialGradient>

</defs>
<style>
  text { font-family: 'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','Times New Roman',serif; }
  .mote { animation: drift 11s ease-in-out infinite; transform-box: fill-box;
           transform-origin: center; }
  @keyframes drift {
    0%   { transform: translate(0,6px);      opacity: 0; }
    18%  { opacity: .85; }
    72%  { opacity: .5; }
    100% { transform: translate(5px,-30px); opacity: 0; }
  }
  .breathe { animation: breathe 6.5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) {
    .mote, .breathe { animation: none; opacity: .6; }
  }
</style>
<rect width="1200" height="122" fill="#080B12"/>
<rect x="72" y="6" width="1056" height="110" rx="5" fill="#111725" fill-opacity=".5" stroke="#E9E6DC" stroke-width="1.3" stroke-opacity=".22" filter="url(#ink)"/>
<rect x="95" y="28.0" width="66" height="66" rx="6" fill="#151D30"/><rect x="95" y="28.0" width="66" height="66" rx="6" fill="none" stroke="#E9E6DC" stroke-width="1.3" opacity=".42" filter="url(#ink)"/><path d="M 110 48.0 L 146 48.0 L 146 74.0 L 110 74.0 Z" fill="none" stroke="#CFD6E4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><path d="M 110 48.0 L 128 63.0 L 146 48.0" fill="none" stroke="#9AA6BC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/><circle cx="128" cy="70.0" r="4.5" fill="#A9E8F0" filter="url(#glowMed)"/>
<text x="188" y="52" font-size="16" fill="#E9E6DC" letter-spacing="3.8" font-weight="normal" text-anchor="start" opacity="1" filter="url(#bloom)">THE SEALED LETTER</text>
<text x="188" y="80" font-size="14" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">The direct way. Carried by hand, answered the same.</text>
<path d="M 867.72 52 L 872.72 58 L 867.72 64 L 862.72 58 Z" fill="none" stroke="#8B96AB" stroke-width="1.4" opacity=".8"/>
<text x="1128" y="63" font-size="12" fill="#A9E8F0" letter-spacing="2.2" font-weight="normal" text-anchor="end" opacity="1" filter="url(#bloomSoft)">MUHIDQAISER02@GMAIL.COM</text>
<circle class="mote" cx="581.8" cy="84.5" r="2.05" fill="#A9E8F0" opacity="0" filter="url(#bloomSoft)" style="animation-delay:-8.4s;animation-duration:11.0s"/><circle class="mote" cx="745.8" cy="72.9" r="0.94" fill="#A9E8F0" opacity="0" filter="url(#bloomSoft)" style="animation-delay:-3.5s;animation-duration:9.2s"/><circle class="mote" cx="783.8" cy="40.2" r="1.45" fill="#A9E8F0" opacity="0" filter="url(#bloomSoft)" style="animation-delay:-9.5s;animation-duration:11.2s"/><circle class="mote" cx="962.7" cy="52.1" r="2.10" fill="#A9E8F0" opacity="0" filter="url(#bloomSoft)" style="animation-delay:-7.7s;animation-duration:9.4s"/><circle class="mote" cx="899.8" cy="32.1" r="1.72" fill="#A9E8F0" opacity="0" filter="url(#bloomSoft)" style="animation-delay:-12.3s;animation-duration:12.9s"/><circle class="mote" cx="301.0" cy="63.2" r="1.95" fill="#A9E8F0" opacity="0" filter="url(#bloomSoft)" style="animation-delay:-4.2s;animation-duration:13.5s"/>
</svg>