<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210"
     viewBox="0 0 1200 210" role="img">
<defs>
  <filter id="ink" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3"
                  seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="inkSoft" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2"
                  seed="19" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/>
             <feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowMed" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="glowWide" x="-140%" y="-140%" width="380%" height="380%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <radialGradient id="lantern" cx="50%" cy="46%" r="62%">
    <stop offset="0%" stop-color="#16203A" stop-opacity=".95"/>
    <stop offset="58%" stop-color="#0B1120" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="78%">
    <stop offset="55%" stop-color="#080B12" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".72"/>
  </radialGradient>

</defs>
<style>
  text { font-family: 'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','Times New Roman',serif; }
  .mote { animation: drift 11s ease-in-out infinite; transform-box: fill-box;
           transform-origin: center; }
  @keyframes drift {
    0%   { transform: translate(0,6px);      opacity: 0; }
    18%  { opacity: .85; }
    72%  { opacity: .5; }
    100% { transform: translate(5px,-30px); opacity: 0; }
  }
  .breathe { animation: breathe 6.5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .48 } 50% { opacity: .95 } }
  @media (prefers-reduced-motion: reduce) {
    .mote, .breathe { animation: none; opacity: .6; }
  }
</style>
<rect width="1200" height="210" fill="#080B12"/>
<ellipse cx="600" cy="150" rx="330" ry="150" fill="url(#lantern)"/>
<path d="M 600 18 L 600 44" stroke="#E9E6DC" stroke-width="1.4" opacity=".35"/>
<circle cx="600" cy="52" r="7" fill="#A9E8F0" filter="url(#glowMed)" class="breathe"/>
<ellipse cx="600" cy="150" rx="210" ry="46" fill="#A9E8F0" opacity=".07" filter="url(#glowWide)"/>
<g filter="url(#ink)">
  <rect x="512" y="126" width="176" height="10" rx="3" fill="#111725" stroke="#E9E6DC" stroke-width="1.3" stroke-opacity=".55"/>
  <rect x="536" y="136" width="11" height="30" rx="2" fill="#111725" stroke="#E9E6DC" stroke-width="1.2" stroke-opacity=".45"/>
  <rect x="652" y="136" width="11" height="30" rx="2" fill="#111725" stroke="#E9E6DC" stroke-width="1.2" stroke-opacity=".45"/>
  <path d="M 528 126 L 528 96 Q 600 84, 672 96 L 672 126" fill="none" stroke="#E9E6DC" stroke-width="1.4" stroke-opacity=".4"/>
</g>
<circle class="mote" cx="685.0" cy="164.3" r="1.96" fill="#A9E8F0" opacity="0" style="animation-delay:-5.7s;animation-duration:9.6s"/><circle class="mote" cx="584.7" cy="118.3" r="0.97" fill="#A9E8F0" opacity="0" style="animation-delay:-4.6s;animation-duration:10.3s"/><circle class="mote" cx="544.2" cy="110.1" r="0.83" fill="#A9E8F0" opacity="0" style="animation-delay:-6.8s;animation-duration:9.6s"/><circle class="mote" cx="584.2" cy="116.4" r="1.75" fill="#A9E8F0" opacity="0" style="animation-delay:-0.7s;animation-duration:11.5s"/><circle class="mote" cx="656.6" cy="124.8" r="1.66" fill="#A9E8F0" opacity="0" style="animation-delay:-13.0s;animation-duration:13.3s"/><circle class="mote" cx="572.6" cy="143.6" r="1.28" fill="#A9E8F0" opacity="0" style="animation-delay:-8.6s;animation-duration:13.0s"/><circle class="mote" cx="562.9" cy="69.4" r="1.42" fill="#A9E8F0" opacity="0" style="animation-delay:-8.3s;animation-duration:14.0s"/><circle class="mote" cx="589.5" cy="130.7" r="1.04" fill="#A9E8F0" opacity="0" style="animation-delay:-3.3s;animation-duration:10.2s"/><circle class="mote" cx="663.2" cy="81.5" r="0.95" fill="#A9E8F0" opacity="0" style="animation-delay:-0.4s;animation-duration:9.7s"/><circle class="mote" cx="555.1" cy="123.0" r="1.87" fill="#A9E8F0" opacity="0" style="animation-delay:-4.2s;animation-duration:11.3s"/><circle class="mote" cx="557.7" cy="93.5" r="1.81" fill="#A9E8F0" opacity="0" style="animation-delay:-3.3s;animation-duration:12.8s"/><circle class="mote" cx="521.4" cy="146.2" r="1.72" fill="#A9E8F0" opacity="0" style="animation-delay:-3.5s;animation-duration:14.8s"/><circle class="mote" cx="609.1" cy="161.1" r="1.57" fill="#A9E8F0" opacity="0" style="animation-delay:-2.6s;animation-duration:15.6s"/><circle class="mote" cx="695.0" cy="66.2" r="1.34" fill="#A9E8F0" opacity="0" style="animation-delay:-7.4s;animation-duration:9.2s"/>
<text x="600" y="196" font-size="13" fill="#A9E8F0" letter-spacing="5" font-weight="normal" text-anchor="middle" opacity="1">REST HERE</text>
<rect width="1200" height="210" fill="url(#vignette)"/>
</svg>