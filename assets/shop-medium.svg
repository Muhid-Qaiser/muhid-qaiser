<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="122"
     viewBox="0 0 1200 122" role="img">
<defs>
  <filter id="ink" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3"
                  seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="inkSoft" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2"
                  seed="19" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <!-- The game's bloom pass: pale things bleed light into the dark. -->
  <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/>
             <feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bloomSoft" x="-45%" y="-45%" width="190%" height="190%">
    <feGaussianBlur stdDeviation="1.7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/>
             <feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowMed" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="glowWide" x="-140%" y="-140%" width="380%" height="380%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <radialGradient id="lantern" cx="50%" cy="46%" r="62%">
    <stop offset="0%" stop-color="#16203A" stop-opacity=".9"/>
    <stop offset="58%" stop-color="#0B1120" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="78%">
    <stop offset="52%" stop-color="#080B12" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".74"/>
  </radialGradient>

</defs>
<style>
  text { font-family: 'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','Times New Roman',serif; }
  .mote { animation: drift 11s ease-in-out infinite; transform-box: fill-box;
           transform-origin: center; }
  @keyframes drift {
    0%   { transform: translate(0,6px);      opacity: 0; }
    18%  { opacity: .85; }
    72%  { opacity: .5; }
    100% { transform: translate(5px,-30px); opacity: 0; }
  }
  .breathe { animation: breathe 6.5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) {
    .mote, .breathe { animation: none; opacity: .6; }
  }
</style>
<rect width="1200" height="122" fill="#080B12"/>
<rect x="72" y="6" width="1056" height="110" rx="5" fill="#111725" fill-opacity=".5" stroke="#E9E6DC" stroke-width="1.3" stroke-opacity=".22" filter="url(#ink)"/>
<rect x="95" y="28.0" width="66" height="66" rx="6" fill="#151D30"/><rect x="95" y="28.0" width="66" height="66" rx="6" fill="none" stroke="#E9E6DC" stroke-width="1.3" opacity=".42" filter="url(#ink)"/><path d="M 143 42.0 C 130 47.0, 117 62.0, 113 79.0" fill="none" stroke="#CFD6E4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/><path d="M 143 42.0 C 139 57.0, 129 68.0, 113 79.0" fill="none" stroke="#9AA6BC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><circle cx="113" cy="79.0" r="3" fill="#A9E8F0" filter="url(#glowMed)"/>
<text x="188" y="52" font-size="16" fill="#E9E6DC" letter-spacing="3.8" font-weight="normal" text-anchor="start" opacity="1" filter="url(#bloom)">THE QUILL</text>
<text x="188" y="80" font-size="14" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">Notes written up after the fact, on what broke and how.</text>
<path d="M 971.3199999999999 52 L 976.3199999999999 58 L 971.3199999999999 64 L 966.3199999999999 58 Z" fill="none" stroke="#8B96AB" stroke-width="1.4" opacity=".8"/>
<text x="1128" y="63" font-size="12" fill="#A9E8F0" letter-spacing="2.2" font-weight="normal" text-anchor="end" opacity="1" filter="url(#bloomSoft)">@MUHID-QAISER</text>
<circle class="mote" cx="528.7" cy="49.9" r="0.98" fill="#A9E8F0" opacity="0" filter="url(#bloomSoft)" style="animation-delay:-0.1s;animation-duration:15.1s"/><circle class="mote" cx="564.5" cy="91.9" r="0.91" fill="#A9E8F0" opacity="0" filter="url(#bloomSoft)" style="animation-delay:-7.9s;animation-duration:12.9s"/><circle class="mote" cx="148.8" cy="50.3" r="1.71" fill="#A9E8F0" opacity="0" filter="url(#bloomSoft)" style="animation-delay:-8.8s;animation-duration:12.2s"/><circle class="mote" cx="253.4" cy="39.0" r="0.94" fill="#A9E8F0" opacity="0" filter="url(#bloomSoft)" style="animation-delay:-11.6s;animation-duration:12.5s"/><circle class="mote" cx="643.4" cy="81.9" r="1.30" fill="#A9E8F0" opacity="0" filter="url(#bloomSoft)" style="animation-delay:-1.4s;animation-duration:14.2s"/><circle class="mote" cx="374.1" cy="73.9" r="1.74" fill="#A9E8F0" opacity="0" filter="url(#bloomSoft)" style="animation-delay:-1.0s;animation-duration:12.0s"/>
</svg>