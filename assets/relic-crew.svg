<svg xmlns="http://www.w3.org/2000/svg" width="600" height="148"
     viewBox="0 0 600 148" role="img">
<defs>
  <filter id="ink" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3"
                  seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="inkSoft" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2"
                  seed="19" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/>
             <feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowMed" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="glowWide" x="-140%" y="-140%" width="380%" height="380%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <radialGradient id="lantern" cx="50%" cy="46%" r="62%">
    <stop offset="0%" stop-color="#16203A" stop-opacity=".95"/>
    <stop offset="58%" stop-color="#0B1120" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="78%">
    <stop offset="55%" stop-color="#080B12" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".72"/>
  </radialGradient>

</defs>
<style>
  text { font-family: 'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','Times New Roman',serif; }
  .mote { animation: drift 11s ease-in-out infinite; transform-box: fill-box;
           transform-origin: center; }
  @keyframes drift {
    0%   { transform: translate(0,6px);      opacity: 0; }
    18%  { opacity: .85; }
    72%  { opacity: .5; }
    100% { transform: translate(5px,-30px); opacity: 0; }
  }
  .breathe { animation: breathe 6.5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .48 } 50% { opacity: .95 } }
  @media (prefers-reduced-motion: reduce) {
    .mote, .breathe { animation: none; opacity: .6; }
  }
</style>
<rect width="600" height="148" fill="#080B12"/>
<rect x="3" y="3" width="594" height="142" rx="5" fill="#111725" fill-opacity=".55" stroke="#E9E6DC" stroke-width="1.3" stroke-opacity=".26" filter="url(#ink)"/>
<circle cx="66" cy="74" r="34" fill="#151D30"/><circle cx="66" cy="74" r="34" fill="none" stroke="#E9E6DC" stroke-width="1.2" opacity=".38" filter="url(#ink)"/><path d="M 66 65 L 51 86" fill="none" stroke="#B4BDCE" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/><circle cx="51" cy="88" r="4.2" fill="#B4BDCE" opacity=".8"/><path d="M 66 65 L 66 86" fill="none" stroke="#B4BDCE" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/><circle cx="66" cy="88" r="4.2" fill="#B4BDCE" opacity=".8"/><path d="M 66 65 L 81 86" fill="none" stroke="#B4BDCE" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/><circle cx="81" cy="88" r="4.2" fill="#B4BDCE" opacity=".8"/><circle cx="66" cy="61" r="6" fill="#A9E8F0" filter="url(#glowMed)"/>
<text x="122" y="56" font-size="16" fill="#E9E6DC" letter-spacing="3.6" font-weight="normal" text-anchor="start" opacity="1">HIERARCHICAL MULTI-DOC RAG</text>
<text x="122" y="78" font-size="10" fill="#A9E8F0" letter-spacing="2.6" font-weight="normal" text-anchor="start" opacity="1">AGENTS</text>
<text x="122" y="102" font-size="13.5" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">A master agent that decomposes a question and delegates it to</text>
<text x="122" y="122" font-size="13.5" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">sub-agents. Building these is how you learn where they break.</text>
<circle class="mote" cx="428.6" cy="48.2" r="1.07" fill="#A9E8F0" opacity="0" style="animation-delay:-0.7s;animation-duration:13.2s"/><circle class="mote" cx="443.7" cy="98.8" r="0.85" fill="#A9E8F0" opacity="0" style="animation-delay:-6.9s;animation-duration:13.8s"/><circle class="mote" cx="370.4" cy="115.8" r="2.08" fill="#A9E8F0" opacity="0" style="animation-delay:-10.0s;animation-duration:11.9s"/><circle class="mote" cx="448.9" cy="117.5" r="0.84" fill="#A9E8F0" opacity="0" style="animation-delay:-3.5s;animation-duration:15.6s"/><circle class="mote" cx="107.3" cy="83.8" r="1.89" fill="#A9E8F0" opacity="0" style="animation-delay:-5.7s;animation-duration:15.7s"/><circle class="mote" cx="470.4" cy="32.8" r="2.06" fill="#A9E8F0" opacity="0" style="animation-delay:-6.0s;animation-duration:11.1s"/>
</svg>