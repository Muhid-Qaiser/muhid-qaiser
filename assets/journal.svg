<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640"
     viewBox="0 0 1200 640" role="img">
<defs>
  <filter id="ink" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3"
                  seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="inkSoft" x="-8%" y="-8%" width="116%" height="116%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2"
                  seed="19" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/>
             <feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowMed" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <filter id="glowWide" x="-140%" y="-140%" width="380%" height="380%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <radialGradient id="lantern" cx="50%" cy="46%" r="62%">
    <stop offset="0%" stop-color="#16203A" stop-opacity=".95"/>
    <stop offset="58%" stop-color="#0B1120" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#080B12" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vignette" cx="50%" cy="50%" r="78%">
    <stop offset="55%" stop-color="#080B12" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".72"/>
  </radialGradient>

</defs>
<style>
  text { font-family: 'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','Times New Roman',serif; }
  .mote { animation: drift 11s ease-in-out infinite; transform-box: fill-box;
           transform-origin: center; }
  @keyframes drift {
    0%   { transform: translate(0,6px);      opacity: 0; }
    18%  { opacity: .85; }
    72%  { opacity: .5; }
    100% { transform: translate(5px,-30px); opacity: 0; }
  }
  .breathe { animation: breathe 6.5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .48 } 50% { opacity: .95 } }
  @media (prefers-reduced-motion: reduce) {
    .mote, .breathe { animation: none; opacity: .6; }
  }
</style>
<rect width="1200" height="640" fill="#080B12"/>
<ellipse cx="600" cy="300" rx="640" ry="380" fill="url(#lantern)" opacity=".55"/>
<text x="72" y="66" font-size="23" fill="#E9E6DC" letter-spacing="6.5" font-weight="normal" text-anchor="start" opacity="1">THE HUNTER'S JOURNAL</text>
<text x="72" y="96" font-size="15" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">Three things I hunt. Each one crosses a boundary somebody believed was closed.</text>
<path d="M 72 118 L 1128 118" stroke="#E9E6DC" stroke-width="1.2" opacity=".2" filter="url(#ink)"/>
<circle cx="118" cy="200" r="46" fill="#151D30"/><circle cx="118" cy="200" r="46" fill="none" stroke="#E9E6DC" stroke-width="1.4" opacity=".45" filter="url(#ink)"/><path d="M 97 184 L 133 184" fill="none" stroke="#B4BDCE" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/><path d="M 97 216 L 133 216" fill="none" stroke="#B4BDCE" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/><path d="M 93 200 L 145 200" fill="none" stroke="#F0A93C" stroke-width="3.6" stroke-linecap="round" opacity="1"/><circle cx="145" cy="200" r="4.2" fill="#F0A93C" filter="url(#glowMed)"/>
<text x="200" y="178" font-size="17.5" fill="#E9E6DC" letter-spacing="5" font-weight="normal" text-anchor="start" opacity="1">THE INJECTED INSTRUCTION</text>
<text x="1128" y="178" font-size="11" fill="#A9E8F0" letter-spacing="3" font-weight="normal" text-anchor="end" opacity="1">BOUNDARY · INSTRUCTION</text>
<path d="M 518.4 174 L 966 174" stroke="#E9E6DC" stroke-width="1" opacity=".13" stroke-dasharray="1 6" stroke-linecap="round"/>
<text x="200" y="212" font-size="14.5" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">Hides in text the model was only asked to read. It speaks in the operator's voice, and is believed.</text>
<text x="200" y="237" font-size="14.5" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">Nothing is forced open. The shell is asked politely, and it obliges.</text>
<path d="M 200 274 L 1128 274" stroke="#E9E6DC" stroke-width="1" opacity=".11" filter="url(#ink)"/>
<circle cx="118" cy="352" r="46" fill="#151D30"/><circle cx="118" cy="352" r="46" fill="none" stroke="#E9E6DC" stroke-width="1.4" opacity=".45" filter="url(#ink)"/><path d="M 112 324 L 112 366" fill="none" stroke="#E9E6DC" stroke-width="4" stroke-linecap="round" opacity="0.95"/><path d="M 100 366 L 124 366" fill="none" stroke="#E9E6DC" stroke-width="3" stroke-linecap="round" opacity="0.9"/><path d="M 112 366 L 112 379" fill="none" stroke="#B4BDCE" stroke-width="2.4" stroke-linecap="round" opacity="0.8"/><path d="M 142 368 C 146 344, 132 326, 120 325" fill="none" stroke="#F0A93C" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M 120 325 L 130 321 M 120 325 L 128 333" fill="none" stroke="#F0A93C" stroke-width="2.6" stroke-linecap="round" opacity="1"/>
<text x="200" y="330" font-size="17.5" fill="#E9E6DC" letter-spacing="5" font-weight="normal" text-anchor="start" opacity="1">THE BORROWED HAND</text>
<text x="1128" y="330" font-size="11" fill="#A9E8F0" letter-spacing="3" font-weight="normal" text-anchor="end" opacity="1">BOUNDARY · ACTION</text>
<path d="M 430.2 326 L 966 326" stroke="#E9E6DC" stroke-width="1" opacity=".13" stroke-dasharray="1 6" stroke-linecap="round"/>
<text x="200" y="364" font-size="14.5" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">Waits for a model that can act rather than only answer. It never argues with the guard.</text>
<text x="200" y="389" font-size="14.5" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">It waits for the guard to reach for a tool, and then guides the hand.</text>
<path d="M 200 426 L 1128 426" stroke="#E9E6DC" stroke-width="1" opacity=".11" filter="url(#ink)"/>
<circle cx="118" cy="504" r="46" fill="#151D30"/><circle cx="118" cy="504" r="46" fill="none" stroke="#E9E6DC" stroke-width="1.4" opacity=".45" filter="url(#ink)"/><rect x="94" y="480" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="107" y="480" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="120" y="480" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="133" y="480" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="94" y="493" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="107" y="493" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="120" y="493" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="133" y="493" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="94" y="506" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="120" y="506" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="133" y="506" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="94" y="519" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="107" y="519" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="120" y="519" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="133" y="519" width="8" height="8" fill="#B4BDCE" opacity=".72"/><rect x="111" y="503" width="10" height="10" fill="#F0A93C" filter="url(#glowMed)"/>
<text x="200" y="482" font-size="17.5" fill="#E9E6DC" letter-spacing="5" font-weight="normal" text-anchor="start" opacity="1">THE POISONED PIXEL</text>
<text x="1128" y="482" font-size="11" fill="#A9E8F0" letter-spacing="3" font-weight="normal" text-anchor="end" opacity="1">BOUNDARY · PERCEPTION</text>
<path d="M 442.79999999999995 478 L 966 478" stroke="#E9E6DC" stroke-width="1" opacity=".13" stroke-dasharray="1 6" stroke-linecap="round"/>
<text x="200" y="516" font-size="14.5" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">Eldest of the three. A change too small for any eye, and the classifier names the wrong thing —</text>
<text x="200" y="541" font-size="14.5" fill="#8B96AB" font-style="italic" text-anchor="start" opacity="1">more certain than it was before. Everything I hunt now is a variation on it.</text>
<circle class="mote" cx="725.4" cy="446.7" r="1.83" fill="#A9E8F0" opacity="0" style="animation-delay:-11.5s;animation-duration:15.6s"/><circle class="mote" cx="1030.8" cy="161.6" r="1.41" fill="#A9E8F0" opacity="0" style="animation-delay:-10.1s;animation-duration:15.6s"/><circle class="mote" cx="1008.9" cy="195.3" r="1.41" fill="#A9E8F0" opacity="0" style="animation-delay:-5.8s;animation-duration:10.7s"/><circle class="mote" cx="675.4" cy="155.2" r="1.08" fill="#A9E8F0" opacity="0" style="animation-delay:-10.0s;animation-duration:11.0s"/><circle class="mote" cx="871.0" cy="213.8" r="1.84" fill="#A9E8F0" opacity="0" style="animation-delay:-6.2s;animation-duration:10.0s"/><circle class="mote" cx="219.2" cy="150.7" r="1.93" fill="#A9E8F0" opacity="0" style="animation-delay:-2.3s;animation-duration:10.5s"/><circle class="mote" cx="1092.1" cy="499.0" r="1.18" fill="#A9E8F0" opacity="0" style="animation-delay:-8.5s;animation-duration:15.7s"/><circle class="mote" cx="781.4" cy="231.9" r="2.02" fill="#A9E8F0" opacity="0" style="animation-delay:-13.4s;animation-duration:13.8s"/><circle class="mote" cx="1001.6" cy="269.5" r="1.27" fill="#A9E8F0" opacity="0" style="animation-delay:-1.5s;animation-duration:10.2s"/><circle class="mote" cx="156.4" cy="270.5" r="1.58" fill="#A9E8F0" opacity="0" style="animation-delay:-6.1s;animation-duration:9.0s"/><circle class="mote" cx="434.7" cy="274.0" r="1.86" fill="#A9E8F0" opacity="0" style="animation-delay:-3.9s;animation-duration:12.4s"/><circle class="mote" cx="580.8" cy="431.9" r="0.87" fill="#A9E8F0" opacity="0" style="animation-delay:-0.4s;animation-duration:15.8s"/><circle class="mote" cx="854.8" cy="488.0" r="0.82" fill="#A9E8F0" opacity="0" style="animation-delay:-5.3s;animation-duration:14.5s"/><circle class="mote" cx="680.1" cy="153.6" r="0.86" fill="#A9E8F0" opacity="0" style="animation-delay:-9.8s;animation-duration:10.3s"/><circle class="mote" cx="290.5" cy="452.3" r="2.01" fill="#A9E8F0" opacity="0" style="animation-delay:-5.4s;animation-duration:15.6s"/><circle class="mote" cx="451.9" cy="359.9" r="1.81" fill="#A9E8F0" opacity="0" style="animation-delay:-7.3s;animation-duration:9.8s"/><circle class="mote" cx="903.2" cy="493.9" r="0.85" fill="#A9E8F0" opacity="0" style="animation-delay:-1.4s;animation-duration:15.6s"/><circle class="mote" cx="437.6" cy="394.3" r="1.99" fill="#A9E8F0" opacity="0" style="animation-delay:-10.5s;animation-duration:11.4s"/><circle class="mote" cx="646.0" cy="275.0" r="1.21" fill="#A9E8F0" opacity="0" style="animation-delay:-0.8s;animation-duration:10.2s"/><circle class="mote" cx="241.8" cy="425.7" r="2.10" fill="#A9E8F0" opacity="0" style="animation-delay:-0.5s;animation-duration:10.1s"/>
<rect width="1200" height="640" fill="url(#vignette)"/>
</svg>