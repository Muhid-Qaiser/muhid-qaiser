<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
<defs>
  <pattern id="grid2" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#14202a" stroke-width="1" opacity=".45"/>
  </pattern>
  <filter id="g2"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="1198" height="438" rx="18" fill="#070b10" stroke="#26313d" stroke-width="2"/>
<rect x="1" y="1" width="1198" height="438" rx="18" fill="url(#grid2)"/>

<!-- left vision panel -->
<rect x="28" y="28" width="556" height="348" rx="14" fill="#0d131a" stroke="#26313d"/>
<text x="52" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#67e8f9">01 // COMPUTER VISION</text>
<text x="52" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#e8edf2">PERCEIVE THE SIGNAL</text>

<!-- fake scene -->
<rect x="52" y="116" width="508" height="187" rx="10" fill="#071018" stroke="#1b2b38"/>
<path d="M72 268 L188 185 L274 237 L353 170 L535 270" fill="none" stroke="#243442" stroke-width="2"/>
<path d="M72 250 H535 M72 225 H535 M72 200 H535 M72 175 H535 M72 150 H535" stroke="#13212b" stroke-width="1"/>
<line x1="72" y1="132" x2="540" y2="132" stroke="#67e8f9" opacity=".7">
  <animate attributeName="y1" values="128;292;128" dur="3.6s" repeatCount="indefinite"/>
  <animate attributeName="y2" values="128;292;128" dur="3.6s" repeatCount="indefinite"/>
</line>

<!-- person -->
<circle cx="210" cy="170" r="12" fill="#18242d" stroke="#67e8f9"/>
<path d="M210 182 L210 235 M210 198 L188 218 M210 198 L232 216 M210 235 L193 269 M210 235 L230 269" stroke="#67e8f9" stroke-width="3" fill="none"/>
<rect x="177" y="150" width="68" height="128" fill="none" stroke="#67e8f9" stroke-width="2"/>
<rect x="177" y="134" width="78" height="18" rx="4" fill="#09242a"/>
<text x="184" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#67e8f9">PERSON 0.98</text>

<!-- tracked object -->
<rect x="375" y="211" width="98" height="48" rx="8" fill="#111b24" stroke="#f1d6b8" stroke-width="2"/>
<circle cx="397" cy="264" r="9" fill="#070b10" stroke="#f1d6b8"/>
<circle cx="451" cy="264" r="9" fill="#070b10" stroke="#f1d6b8"/>
<rect x="364" y="196" width="84" height="18" rx="4" fill="#251d16"/>
<text x="371" y="209" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#f1d6b8">TRACK 07</text>

<text x="58" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8896a5">DETECT 98%   SEGMENT ✓   DEPTH 2.4m   TRACK 07   FPS 42</text>
<text x="58" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#67e8f9">pixels -> geometry -> representations</text>

<!-- right security panel -->
<rect x="616" y="28" width="556" height="348" rx="14" fill="#0d131a" stroke="#26313d"/>
<text x="640" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#ff5a67">02 // AGENTIC SECURITY</text>
<text x="640" y="92" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#e8edf2">BREAK THE ASSUMPTION</text>

<!-- core -->
<circle cx="894" cy="214" r="74" fill="#091018" stroke="#f1d6b8" stroke-width="2"/>
<circle cx="894" cy="214" r="51" fill="#070b10" stroke="#394552" stroke-width="1.5"/>
<circle cx="894" cy="214" r="15" fill="#f1d6b8" filter="url(#g2)">
  <animate attributeName="r" values="12;17;12" dur="2.3s" repeatCount="indefinite"/>
</circle>
<text x="866" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#f1d6b8">AGENT CORE</text>

<!-- guard orbit -->
<circle cx="894" cy="214" r="93" fill="none" stroke="#63e6be" stroke-width="2" stroke-dasharray="6 9" opacity=".65">
  <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 894 214" to="360 894 214" dur="14s" repeatCount="indefinite"/>
</circle>
<text x="842" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#63e6be">GUARD / POLICY</text>

<!-- surfaces -->
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">
  <rect x="648" y="133" width="112" height="36" rx="7" fill="#160d10" stroke="#ff5a67"/>
  <text x="672" y="155" fill="#ff5a67">PROMPT</text>
  <line x1="760" y1="151" x2="821" y2="188" stroke="#ff5a67" stroke-width="2" stroke-dasharray="5 5"/>
  <circle r="4" fill="#ff5a67">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M760 151 L821 188"/>
  </circle>

  <rect x="648" y="197" width="112" height="36" rx="7" fill="#160d10" stroke="#ff5a67"/>
  <text x="672" y="219" fill="#ff5a67">MEMORY</text>
  <line x1="760" y1="215" x2="816" y2="215" stroke="#ff5a67" stroke-width="2" stroke-dasharray="5 5"/>

  <rect x="648" y="261" width="112" height="36" rx="7" fill="#160d10" stroke="#ff5a67"/>
  <text x="674" y="283" fill="#ff5a67">ARTIFACT</text>
  <line x1="760" y1="279" x2="824" y2="244" stroke="#ff5a67" stroke-width="2" stroke-dasharray="5 5"/>
  <circle r="4" fill="#ff5a67">
    <animateMotion dur="3.2s" repeatCount="indefinite" path="M760 279 L824 244"/>
  </circle>

  <rect x="1025" y="149" width="112" height="36" rx="7" fill="#111820" stroke="#f7c873"/>
  <text x="1060" y="171" fill="#f7c873">TOOLS</text>
  <line x1="968" y1="190" x2="1025" y2="167" stroke="#f7c873" stroke-width="2" stroke-dasharray="5 5"/>

  <rect x="1025" y="238" width="112" height="36" rx="7" fill="#111820" stroke="#f7c873"/>
  <text x="1052" y="260" fill="#f7c873">ACTIONS</text>
  <line x1="968" y1="235" x2="1025" y2="256" stroke="#f7c873" stroke-width="2" stroke-dasharray="5 5"/>
</g>

<text x="640" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8896a5">prompt · memory · tools · artifacts · actions</text>
<text x="640" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ff5a67">find the failure before the failure finds production</text>

<!-- footer bridge -->
<line x1="190" y1="407" x2="1010" y2="407" stroke="#26313d"/>
<text x="359" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8896a5">PERCEIVE</text>
<text x="496" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f1d6b8">- REASON -</text>
<text x="626" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#f7c873">ACT</text>
<text x="672" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#ff5a67">- DEFEND</text>
</svg>